[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "library-network-api"
version = "0.1.0"
description = "Reliable interlibrary lending: a backend engineering portfolio case study"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "PyJWT[crypto]>=2.13,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a real PostgreSQL server (TEST_DATABASE_URL); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` default argument is the framework idiom.
"app/main.py" = ["B008"]
"app/db.py" = ["B008"]
"app/api/routes.py" = ["B008"]
# Long literal assertions read better unwrapped.
"tests/**" = ["E501"]
