name: Web Operations CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript + unit tests + Next.js build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Synthetic ONLY: no OAuth or upstream requests during static build.
      AUTH_SECRET: "ci-only-dummy-auth-secret-no-real-users"
      AUTH_GITHUB_ID: "ci-github-oauth-placeholder"
      AUTH_GITHUB_SECRET: "ci-github-oauth-placeholder"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "22"
      - name: Install (lockfile to be added after initial dependency spike)
        run: npm install --no-audit --no-fund
      - name: Server-side input tests
        run: npm run test
      - name: TypeScript
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Export npm lockfile for pinned dependency checkpoint
        run: sed 's/^/LN_LOCK_JSON:/' package-lock.json
