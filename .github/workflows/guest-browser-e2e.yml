name: Guest Browser E2E (isolated)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: guest-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    name: No-login real loan in Chromium + PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: library_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql+psycopg://library_test:local_test_only@127.0.0.1:5432/postgres
      LIBRARY_RUNTIME_MODE: "test"
      LIBRARY_ENABLE_UNSAFE_V1: "0"
      LIBRARY_API_URL: http://127.0.0.1:8765
      LIBRARY_JWT_ISSUER: https://library-qa.invalid
      LIBRARY_JWT_AUDIENCE: library-network-api
      AUTH_URL: http://127.0.0.1:3000
      AUTH_SECRET: "ci-only-guest-browser-placeholder-secret-for-testing"
      AUTH_GITHUB_ID: "ci-no-real-oauth"
      AUTH_GITHUB_SECRET: "ci-no-real-oauth"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "22"
      - name: Install Python API + pinned web
        run: |
          python -m pip install -e ".[dev]"
          cd web && npm ci --no-audit --no-fund
      - name: Install isolated, locked Playwright QA dependencies
        run: |
          cd qa/browser
          npm ci --no-audit --no-fund
          npx playwright install chromium --with-deps --only-shell
      - name: Generate synthetic-only RSA pair and guest cookie secret
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import secrets
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          pem = key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          ).decode()
          pub = key.public_key().public_numbers()
          def b64(value):
              data = value.to_bytes((value.bit_length() + 7) // 8, "big")
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()
          jwks = {"keys": [{
              "kty": "RSA", "kid": "ci-temporary-guest",
              "alg": "RS256", "use": "sig",
              "n": b64(pub.n), "e": b64(pub.e),
          }]}
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.write("LIBRARY_JWKS_JSON=" + json.dumps(jwks, separators=(",", ":")) + "\n")
              target.write("LIBRARY_API_SIGNING_KEY_PKCS8=" + pem.replace("\n", "\\n") + "\n")
              target.write("LIBRARY_API_SIGNING_KID=ci-temporary-guest\n")
              target.write("LIBRARY_GUEST_COOKIE_SECRET=" + secrets.token_hex(32) + "\n")
          print("Ephemeral signing/JWKS material created for disposable CI only.")
          PY
      - name: Migrate disposable PostgreSQL and seed synthetic fixtures
        run: |
          alembic upgrade head
          python -m app.persistence.seed
      - name: Start FastAPI in CI only
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/library-api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/ready >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "FastAPI did not start."
          exit 1
      - name: Start Next.js BFF in CI only
        run: |
          cd web
          nohup npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/library-web.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "Next.js did not start."
          exit 1
      - name: "Chromium - real anonymous checkout, return, isolation and cookie tamper"
        run: |
          cd qa/browser
          npm run test
      - name: Print local server diagnostics if browser QA fails
        if: failure()
        run: |
          echo "FastAPI logs (CI synthetic):"
          tail -n 100 "$RUNNER_TEMP/library-api.log" 2>/dev/null || true
          echo "Next.js logs (CI synthetic):"
          tail -n 100 "$RUNNER_TEMP/library-web.log" 2>/dev/null || true
