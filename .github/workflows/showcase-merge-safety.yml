name: Merge Safety - Preserve Existing Showcase

# This CI guard runs after a PR event. Prevent automatic deploys before pushing by
# verifying the project's Vercel branch veto and deployment history separately.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  protect-public-showcase:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify changes cannot alter the published showcase
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci/check_showcase_merge_safety.py
