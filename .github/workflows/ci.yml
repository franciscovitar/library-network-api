name: CI

# Pull requests only. Verification is the whole point: the job FAILS if the real-PostgreSQL
# integration tests do not run (see tests/conftest.py and scripts/ci/check_test_report.py).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: library_test
          POSTGRES_PASSWORD: local_test_only # throwaway CI database, not a secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql+psycopg://library_test:local_test_only@127.0.0.1:5432/postgres
      # Turns "skip the integration tests" (fine locally) into a hard failure.
      REQUIRE_INTEGRATION_TESTS: "1"
      PYTHON_VERSION: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CI Python matches the Dockerfile
        run: |
          docker_python="$(sed -n 's/^FROM python:\([0-9][0-9.]*\)-.*/\1/p' Dockerfile | head -n1)"
          echo "Dockerfile base: python:${docker_python}; CI: ${PYTHON_VERSION}"
          test "${docker_python}" = "${PYTHON_VERSION}"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Browser showcase model tests (no network)
        run: node --test showcase/model.test.mjs

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Ruff (format)
        run: python -m ruff format --check .

      - name: Tests (unit + HTTP + integration on real PostgreSQL)
        run: python -m pytest -ra --strict-markers --junitxml=test-report.xml

      - name: Fail unless the PostgreSQL tests ran (no skips)
        run: python scripts/ci/check_test_report.py test-report.xml --min-integration 100 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify documented local Docker demo
        timeout-minutes: 5
        run: |
          set -e
          trap 'docker compose down -v' EXIT
          docker compose up --build -d
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/ready
          docker compose run --rm api python -m app.persistence.seed
          python scripts/demo_scenario.py
