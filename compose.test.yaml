# Disposable PostgreSQL for the integration tests ONLY. Separate from the demo stack in
# compose.yaml (whose database publishes no host port). Bound to 127.0.0.1, data in tmpfs,
# so stopping it discards everything. Local throwaway credentials, never reuse.
name: library-network-test

services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: library_test
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
